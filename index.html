<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFAF9">
<title>Sock Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<script src="js/theme-init.js"></script>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/sock.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/start.css">
<link rel="stylesheet" href="css/heel-figure.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1 data-i18n="page.title"></h1>
      <p class="sub" data-i18n="page.sub"></p>
    </div>
    <div class="top-right">
    <div class="tools">
      <div class="lang" role="group" data-i18n-aria="ui.langAria">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button"></button>
    </div>
    <div class="tabs" role="tablist" data-i18n-aria="ui.tabsAria">
      <button class="tab" id="tab-start" role="tab" aria-selected="true" aria-controls="view-start" type="button" data-i18n="ui.tabStart"></button>
      <button class="tab" id="tab-sock" role="tab" aria-selected="false" aria-controls="view-sock" type="button" data-i18n="ui.tabSock"></button>
    </div>
    </div>
  </header>

  <section id="view-start" role="tabpanel" aria-labelledby="tab-start">
    <p class="intro" data-i18n="page.intro"></p>
    <div class="start-grid">
      <div>
        <h3 data-i18n="page.yarn-h"></h3>
        <p data-i18n="page.yarn-1"></p>
        <p class="fine" data-i18n="page.yarn-2"></p>
      </div>
      <div>
        <h3 data-i18n="page.needles-h"></h3>
        <p data-i18n="page.needles-1"></p>
        <p class="fine" data-i18n="page.needles-2"></p>
        <p class="fine" data-i18n="page.needles-3"></p>
      </div>
      <div>
        <h3 data-i18n="page.kit-h"></h3>
        <p data-i18n="page.kit-1"></p>
      </div>
      <div>
        <h3 data-i18n="page.skills-h"></h3>
        <p data-i18n="page.skills-1"></p>
        <p class="fine" data-i18n="page.skills-2"></p>
        <p class="fine" data-i18n="page.skills-3"></p>
      </div>
      <div>
        <h3 data-i18n="page.measure-h"></h3>
        <p data-i18n="page.measure-1"></p>
      </div>
    </div>

    <section class="calc" aria-labelledby="calc-title">
      <h3 id="calc-title" data-i18n="page.calc-h"></h3>
      <p class="fine" style="margin-top:6px" data-i18n="page.calc-note"></p>
      <div class="fields">
        <div class="field">
          <label for="circ" data-i18n="page.circ-label"></label>
          <input id="circ" type="number" inputmode="decimal" min="10" max="40" step="0.5" value="22">
        </div>
        <div class="field">
          <label for="gauge" data-i18n="page.gauge-label"></label>
          <input id="gauge" type="number" inputmode="decimal" min="10" max="60" step="0.5" value="32">
        </div>
        <div class="field">
          <label for="ribbing" data-i18n="page.ribbing-label"></label>
          <select id="ribbing">
            <option value="2x2">2x2</option>
            <option value="1x1">1x1</option>
          </select>
        </div>
      </div>
      <p class="result" aria-live="polite"><span data-i18n="page.cast-pre"></span><strong id="cast">64</strong><span data-i18n="page.cast-post"></span></p>
      <p class="fine" data-i18n="page.calc-fine"></p>
    </section>

    <div class="start-cta"><button class="btn primary" type="button" data-go="cuff" data-i18n="ui.cta"></button></div>
  </section>

  <section id="view-sock" class="sock-view" role="tabpanel" aria-labelledby="tab-sock" hidden>
    <div class="sock-col">
      <svg id="sock" viewBox="60 0 360 420" role="group" data-i18n-aria="ui.sockAria">
        <defs>
          <clipPath id="sockclip">
            <path d="M110,20 L230,20 L230,248 C232,285 262,300 300,300 L348,300 C382,300 396,328 396,350 C396,380 376,396 346,396 L142,396 C104,396 85,376 85,340 C85,300 110,290 110,250 Z"/>
          </clipPath>
          <pattern id="knit" width="12" height="14" patternUnits="userSpaceOnUse">
            <path d="M1.5 2 L6 11 L10.5 2" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </pattern>
          <pattern id="rib" width="12" height="12" patternUnits="userSpaceOnUse">
            <rect x="0" y="0" width="5" height="12" fill="#fff" fill-opacity="0.24"/>
          </pattern>
        </defs>

        <g class="part" data-id="leg" role="button" tabindex="0" aria-pressed="false">
          <rect class="shape z-leg" clip-path="url(#sockclip)" x="70" y="62" width="190" height="153"/>
        </g>
        <g class="part" data-id="cuff" role="button" tabindex="0" aria-pressed="true">
          <rect class="shape z-cuff" clip-path="url(#sockclip)" x="70" y="10" width="190" height="52"/>
        </g>
        <g class="part" data-id="heel" role="button" tabindex="0" aria-pressed="false">
          <polygon class="shape z-heel" clip-path="url(#sockclip)" points="60,215 232,215 163,415 60,415"/>
        </g>
        <g class="part" data-id="gusset" role="button" tabindex="0" aria-pressed="false">
          <polygon class="shape z-foot" clip-path="url(#sockclip)" points="232,215 320,215 320,415 163,415"/>
        </g>
        <g class="part" data-id="toe" role="button" tabindex="0" aria-pressed="false">
          <rect class="shape z-toe" clip-path="url(#sockclip)" x="318" y="270" width="110" height="145"/>
        </g>

        <rect clip-path="url(#sockclip)" x="70" y="62" width="350" height="350" fill="url(#knit)" pointer-events="none"/>
        <rect clip-path="url(#sockclip)" x="70" y="10" width="190" height="52" fill="url(#rib)" pointer-events="none"/>
        <path d="M110,20 L230,20 L230,248 C232,285 262,300 300,300 L348,300 C382,300 396,328 396,350 C396,380 376,396 346,396 L142,396 C104,396 85,376 85,340 C85,300 110,290 110,250 Z" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" pointer-events="none"/>

        <g class="badge" data-id="cuff"><circle cx="170" cy="41" r="15"/><text x="170" y="41"></text></g>
        <g class="badge" data-id="leg"><circle cx="170" cy="138" r="15"/><text x="170" y="138"></text></g>
        <g class="badge" data-id="heel"><circle cx="135" cy="320" r="15"/><text x="135" y="320"></text></g>
        <g class="badge" data-id="gusset"><circle cx="258" cy="350" r="15"/><text x="258" y="350"></text></g>
        <g class="badge" data-id="toe"><circle cx="362" cy="345" r="15"/><text x="362" y="345"></text></g>
      </svg>
      <div class="chips" id="chips" role="group" data-i18n-aria="ui.chipsAria"></div>
    </div>
    <article class="panel" id="panel">
      <div id="pcontent" aria-live="polite"></div>
      <nav class="pager" id="ppager" data-i18n-aria="ui.pagerAria"></nav>
    </article>
  </section>
</div>


<script type="module" src="js/app.js"></script>
</body>
</html>
