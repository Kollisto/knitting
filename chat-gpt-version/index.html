<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fffaf0">
<title>Простой носок — KOLLISTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="./" aria-label="Kollisto home"><span>KOLLISTO <i>✦</i></span><small>knitting tutorials</small></a>
  <div class="language" aria-label="Language"><button data-lang="ru" class="active">RU</button><button data-lang="en">EN</button></div>
</header>
<main>
  <section class="hero">
    <div class="yarn-doodle left" aria-hidden="true">◎<span>〰</span></div>
    <div><p class="eyebrow" data-page="sub"></p><h1 data-page="title"></h1><p class="hero-sub" data-hero-sub></p></div>
    <div class="yarn-doodle right" aria-hidden="true">〰</div>
  </section>

  <section class="tutorial-shell" aria-label="Sock tutorial">
    <div class="lesson-layout">
      <div class="sock-column">
        <svg class="sock-map" viewBox="0 0 600 590" role="group" aria-label="Interactive sock diagram">
          <defs>
            <clipPath id="sockClip"><path d="M142 35 Q142 25 155 28 L292 42 Q306 44 304 60 L286 310 Q282 347 316 370 L438 430 Q483 451 480 495 Q477 540 434 548 Q404 553 374 533 L145 394 Q105 370 116 324 L140 52 Q141 42 142 35Z"/></clipPath>
            <pattern id="knitTexture" width="13" height="16" patternUnits="userSpaceOnUse"><path d="M2 2l4 10 5-10" fill="none" stroke="#fff" stroke-width="1.5" opacity=".5" stroke-linecap="round"/></pattern>
            <pattern id="ribTexture" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M3 0v12M8 0v12" stroke="#fff" stroke-width="2" opacity=".5"/></pattern>
          </defs>
          <g clip-path="url(#sockClip)">
            <path class="sock-zone leg" data-id="leg" d="M125 60L310 55 286 310 170 385 105 345Z"/>
            <path class="sock-zone cuff" data-id="cuff" d="M125 15L320 35 310 105 125 88Z"/>
            <path class="sock-zone heel" data-id="heel" d="M105 315L170 365 270 425 160 455 65 385Z"/>
            <path class="sock-zone foot" data-id="gusset" d="M170 365L286 310 455 405 390 510 160 455Z"/>
            <path class="sock-zone toe" data-id="toe" d="M390 420L520 455 500 580 365 540 390 510Z"/>
            <rect x="70" y="15" width="470" height="560" fill="url(#knitTexture)" pointer-events="none"/>
            <rect x="120" y="15" width="210" height="100" fill="url(#ribTexture)" pointer-events="none"/>
          </g>
          <path class="sock-outline" d="M142 35 Q142 25 155 28 L292 42 Q306 44 304 60 L286 310 Q282 347 316 370 L438 430 Q483 451 480 495 Q477 540 434 548 Q404 553 374 533 L145 394 Q105 370 116 324 L140 52 Q141 42 142 35Z"/>
          <g class="map-label"><path d="M300 73H390"/><circle cx="408" cy="73" r="15"/><text x="408" y="78">1</text><text x="432" y="79" class="label-text" data-label="cuff"></text></g>
          <g class="map-label"><path d="M286 190H390"/><circle cx="408" cy="190" r="15"/><text x="408" y="195">2</text><text x="432" y="196" class="label-text" data-label="leg"></text></g>
          <g class="map-label"><path d="M160 390H390"/><circle cx="408" cy="390" r="15"/><text x="408" y="395">3</text><text x="432" y="396" class="label-text" data-label="heel"></text></g>
          <g class="map-label"><path d="M350 460H390"/><circle cx="408" cy="460" r="15"/><text x="408" y="465">4</text><text x="432" y="466" class="label-text" data-label="gusset"></text></g>
          <g class="map-label"><path d="M440 520H490"/><circle cx="508" cy="520" r="15"/><text x="508" y="525">5</text><text x="530" y="526" class="label-text" data-label="toe"></text></g>
        </svg>
        <p class="diagram-hint" data-ui="diagramHint"></p>
      </div>
      <article class="lesson-card" aria-live="polite">
        <div id="lesson-content"></div>
        <div class="lesson-actions"><button class="arrow-btn" id="prev-step" aria-label="Previous step">←</button><button class="next-btn" id="next-step"></button></div>
      </article>
    </div>
    <nav class="step-nav" id="step-nav" aria-label="Tutorial steps"></nav>
    <section class="info-grid" id="info-grid"></section>
    <section class="calculator">
      <div class="calc-illustration" aria-hidden="true">
        <svg viewBox="0 0 150 190">
          <path d="M38 12L105 17 100 105Q100 119 116 134L131 151Q143 166 129 177Q116 187 103 174L29 119Q16 108 22 91L34 20Q35 13 38 12Z" fill="none" stroke="#34333b" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M38 12L105 17 101 37 34 32Z" fill="none" stroke="#34333b" stroke-width="1.7"/>
          <path d="M45 13v17m9-16v17m9-16v17m9-16v17m9-16v17m9-16v17" stroke="#34333b" stroke-width="1.3"/>
          <path d="M23 91q15 9 24 24m54-10q-4 14-14 20m42 24q-10 8-21 7" fill="none" stroke="#aaa5af" stroke-width="1.5" stroke-dasharray="3 3"/>
          <path d="M110 3v29m-4-4 4 4 4-4" fill="none" stroke="#34333b" stroke-width="1.4"/>
        </svg>
      </div>
      <div class="calc-content">
        <h2 data-page="calc-h"></h2><p data-page="calc-note"></p>
        <div class="calc-fields">
          <label><span data-page="circ-label"></span><input id="circ" type="number" min="10" max="40" step=".5" value="22"></label>
          <label><span data-page="gauge-label"></span><input id="gauge" type="number" min="10" max="60" step=".5" value="32"></label>
          <label><span data-page="ribbing-label"></span><select id="ribbing"><option value="2x2">2×2</option><option value="1x1">1×1</option></select></label>
        </div>
        <div class="calc-result"><span data-page="cast-pre"></span> <strong id="cast">64</strong> <span data-page="cast-post"></span><small data-page="calc-fine"></small></div>
      </div>
      <button class="calculate-btn" id="calculate"></button>
    </section>
  </section>
  <footer>KOLLISTO <span>✦</span> <small>knitting tutorials</small></footer>
</main>
<script src="app.js"></script>
</body>
</html>
