<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fffaf0">
<title>Простой носок — KOLLISTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="./" aria-label="Kollisto home"><span>KOLLISTO <i>✦</i></span><small>knitting tutorials</small></a>
  <div class="language" aria-label="Language"><button data-lang="ru" class="active">RU</button><button data-lang="en">EN</button></div>
</header>
<main>
  <section class="hero">
    <div class="yarn-doodle left" aria-hidden="true">◎<span>〰</span></div>
    <div><p class="eyebrow" data-page="sub"></p><h1 data-page="title"></h1><p class="hero-sub" data-hero-sub></p></div>
    <div class="yarn-doodle right" aria-hidden="true">〰</div>
  </section>

  <section class="tutorial-shell" aria-label="Sock tutorial">
    <div class="lesson-layout">
      <div class="sock-column">
        <svg class="sock-map" viewBox="0 0 620 600" role="group" aria-label="Interactive sock diagram">
          <defs>
            <path id="sock-silhouette" d="M153 42 Q153 28 169 30 L365 45 Q381 47 379 64 L357 292 Q354 326 378 347 L472 423 Q510 453 490 494 Q472 535 431 529 Q410 527 384 512 L143 397 Q101 377 115 338 L145 65 Q147 48 153 42Z"/>
            <clipPath id="sockClip"><use href="#sock-silhouette"/></clipPath>
            <pattern id="knitTexture" width="12" height="15" patternUnits="userSpaceOnUse">
              <path d="M2 2q4 4 8 0M2 8q4 4 8 0" fill="none" stroke="#fff" stroke-width="1.2" opacity=".38" stroke-linecap="round"/>
            </pattern>
            <pattern id="ribTexture" width="13" height="13" patternUnits="userSpaceOnUse">
              <path d="M3 0v13M9 0v13" stroke="#fff" stroke-width="2" opacity=".62"/>
            </pattern>
            <linearGradient id="sockPaper" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#8b6bb3" stop-opacity=".08"/>
            </linearGradient>
          </defs>
          <g clip-path="url(#sockClip)">
            <path class="sock-zone leg" data-id="leg" tabindex="0" role="button" aria-label="Leg" d="M145 83 L380 100 L356 292 Q353 327 378 347 L245 410 L105 345Z"/>
            <path class="sock-zone cuff" data-id="cuff" tabindex="0" role="button" aria-label="Cuff" d="M145 25 L390 42 L383 112 L139 94Z"/>
            <path class="sock-zone heel" data-id="heel" tabindex="0" role="button" aria-label="Heel" d="M105 324 Q75 363 111 397 Q130 415 163 410 L245 410 L178 454 L78 400Z"/>
            <path class="sock-zone foot" data-id="gusset" tabindex="0" role="button" aria-label="Foot" d="M178 390 L356 292 L378 347 L480 424 L422 522 L143 397Z"/>
            <path class="sock-zone toe" data-id="toe" tabindex="0" role="button" aria-label="Toe" d="M378 347 L510 430 Q510 480 490 510 Q469 544 425 529 L384 512 L422 522Z"/>
            <rect x="65" y="20" width="470" height="540" fill="url(#knitTexture)" pointer-events="none"/>
            <path d="M145 25L390 42 383 112 139 94Z" fill="url(#ribTexture)" pointer-events="none"/>
            <use href="#sock-silhouette" fill="url(#sockPaper)" pointer-events="none"/>
          </g>
          <use href="#sock-silhouette" class="sock-outline"/>
          <path class="sock-seam" d="M145 94Q260 105 383 112M356 292Q340 336 378 347M178 390Q155 414 143 397" />
          <g class="map-label"><path d="M370 78H438"/><circle cx="455" cy="78" r="15"/><text x="455" y="83">1</text><text x="480" y="84" class="label-text" data-label="cuff"></text></g>
          <g class="map-label"><path d="M355 205H438"/><circle cx="455" cy="205" r="15"/><text x="455" y="210">2</text><text x="480" y="211" class="label-text" data-label="leg"></text></g>
          <g class="map-label"><path d="M126 375H438"/><circle cx="455" cy="375" r="15"/><text x="455" y="380">3</text><text x="480" y="381" class="label-text" data-label="heel"></text></g>
          <g class="map-label"><path d="M335 445H438"/><circle cx="455" cy="445" r="15"/><text x="455" y="450">4</text><text x="480" y="451" class="label-text" data-label="gusset"></text></g>
          <g class="map-label"><path d="M450 510H500"/><circle cx="517" cy="510" r="15"/><text x="517" y="515">5</text><text x="542" y="516" class="label-text" data-label="toe"></text></g>
        </svg>
        <p class="diagram-hint" data-ui="diagramHint"></p>
      </div>
      <article class="lesson-card" aria-live="polite">
        <div id="lesson-content"></div>
        <div class="lesson-actions"><button class="arrow-btn" id="prev-step" aria-label="Previous step">←</button><button class="next-btn" id="next-step"></button></div>
      </article>
    </div>
    <nav class="step-nav" id="step-nav" aria-label="Tutorial steps"></nav>
    <section class="info-grid" id="info-grid"></section>
    <section class="calculator">
      <div class="calc-illustration" aria-hidden="true">
        <svg viewBox="0 0 150 190">
          <path d="M38 12L105 17 100 105Q100 119 116 134L131 151Q143 166 129 177Q116 187 103 174L29 119Q16 108 22 91L34 20Q35 13 38 12Z" fill="none" stroke="#34333b" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M38 12L105 17 101 37 34 32Z" fill="none" stroke="#34333b" stroke-width="1.7"/>
          <path d="M45 13v17m9-16v17m9-16v17m9-16v17m9-16v17m9-16v17" stroke="#34333b" stroke-width="1.3"/>
          <path d="M23 91q15 9 24 24m54-10q-4 14-14 20m42 24q-10 8-21 7" fill="none" stroke="#aaa5af" stroke-width="1.5" stroke-dasharray="3 3"/>
          <path d="M110 3v29m-4-4 4 4 4-4" fill="none" stroke="#34333b" stroke-width="1.4"/>
        </svg>
      </div>
      <div class="calc-content">
        <h2 data-page="calc-h"></h2><p data-page="calc-note"></p>
        <div class="calc-fields">
          <label><span data-page="circ-label"></span><input id="circ" type="number" min="10" max="40" step=".5" value="22"></label>
          <label><span data-page="gauge-label"></span><input id="gauge" type="number" min="10" max="60" step=".5" value="32"></label>
          <label><span data-page="ribbing-label"></span><select id="ribbing"><option value="2x2">2×2</option><option value="1x1">1×1</option></select></label>
        </div>
        <div class="calc-result"><span data-page="cast-pre"></span> <strong id="cast">64</strong> <span data-page="cast-post"></span><small data-page="calc-fine"></small></div>
      </div>
      <button class="calculate-btn" id="calculate"></button>
    </section>
  </section>
  <footer>KOLLISTO <span>✦</span> <small>knitting tutorials</small></footer>
</main>
<script src="app.js"></script>
</body>
</html>
